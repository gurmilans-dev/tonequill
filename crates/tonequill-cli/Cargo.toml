[package]
name = "tonequill-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command-line tools for the Tonequill acoustic data link"

[[bin]]
name = "tonequill"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.2"
ctrlc = "3.5"
hound = "3.5.1"
sha2 = "0.11.0"
tonequill-core = { path = "../tonequill-core" }
tonequill-live = { path = "../tonequill-live" }
